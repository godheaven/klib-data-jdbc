version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      maven-plugins:
        patterns: ["org.apache.maven.plugins:*", "org.codehaus.mojo:*", "org.jacoco:*", "com.diffplug.spotless:*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
